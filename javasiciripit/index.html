<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="hero bg-base-200 min-h-screen">
        <div class="hero-content flex justify-between flex-col lg:flex-row gap-8">
            <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                    <label class="label">Email</label>
                    <input id="email" type="email" class="input" placeholder="Email" />
                    <label class="label">Password</label>
                    <input id="password" type="password" class="input" placeholder="Password" />
                    <div><a class="link link-hover">Forgot password?</a></div>
                    <button id="login" class="btn btn-neutral mt-4">Login</button>
                    </fieldset>
                </div>
            </div>
            <div class="rounded-box border border-base-200 bg-base-100 w-150 shadow-2xl">
                <table class="table">
                    <!-- head -->
                    <thead>
                    <tr>
                        <th></th>
                        <th>Email</th>
                        <th>Password</th>
                    </tr>
                    </thead>
                        <tbody id="tabd">
                            <!-- row 1 -->
                            <tr>
                                <th>1</th>
                                <td>Cy Ganderton</td>
                                <td>Quality Control Specialist</td>
                            </tr>
                        </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        function addtotable(var1, var2) {
            const tbody = document.getElementById('tabd');
            const newRow = `
                <tr>
                    <th>${tbody.children.length + 1}</th>
                    <td>${var1}</td>
                    <td>${var2}</td>
                </tr>
            `;
            tbody.insertAdjacentHTML('beforeend', newRow);
            // Create a new row element
            // const newRowElement = document.createElement('tr');
            // Use innerHTML to set the content using your template literal string
            // newRowElement.innerHTML = `
            //    <th>${tbody.children.length + 1}</th>
            //    <td>${var1}</td>
            //    <td>${var2}</td>
            //`;
            // Now you can safely use appendChild() because newRowElement is a Node
            // tbody.appendChild(newRowElement); 
        }
        document.getElementById('login').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const password = parseFloat(document.getElementById('password').value);
            addtotable(email, password);
        });
    </script>
</body>
</html>
